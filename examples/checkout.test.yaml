version: "1.0"

name: checkout flow with validation

steps:
  - script: 'echo "{\"variables\": {\"THREAD_ID\": \"th_123\"}}"'

  - message: "I want to checkout"
    expect:
      tool_names:
        ordered:
          - equals: "validate_cart"
          - equals: "get_shipping_options"
      response:
        having:
          durationMs: { max: 30000 }

  - message: "Use the first shipping option"
    expect:
      tools:
        some:
          having:
            name: { equals: "calculate_total" }

  - message: "Confirm and pay"
    expect:
      tools:
        filter:
          having:
            name: { equals: "charge_card" }
        count: { equals: 1 }
