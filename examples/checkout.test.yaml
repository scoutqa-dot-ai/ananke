version: "1.0"

name: checkout flow with validation

hooks:
  - cmd: ["echo", "{\"THREAD_ID\": \"th_123\"}"]
    timeout_ms: 10000

turns:
  - user: "I want to checkout"
    assert:
      tool_names:
        ordered:
          - equals: "validate_cart"
          - equals: "get_shipping_options"
      duration_ms:
        max: 30000

  - user: "Use the first shipping option"
    assert:
      tools:
        some:
          match:
            name: { equals: "calculate_total" }
            result:
              json:
                must_not_match: "error|failed"

  - user: "Confirm and pay"
    assert:
      tools:
        filter:
          match:
            name: { equals: "charge_card" }
        count: { exact: 1 }
        none:
          match:
            result:
              json:
                must_match: "declined|insufficient"

assert:
  tool_names:
    none: { equals: "delete_order" }
  duration_ms:
    max: 120000
  idle_ms:
    max: 60000
