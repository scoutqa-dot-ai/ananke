version: "1.0"

name: checkout flow with validation

hooks:
  - cmd: ["echo", "{\"variables\": {\"THREAD_ID\": \"th_123\"}}"]
    timeout_ms: 10000

turns:
  - user: "I want to checkout"
    assert:
      tool_names:
        ordered:
          - equals: "validate_cart"
          - equals: "get_shipping_options"
      response:
        having:
          durationMs: { max: 30000 }

  - user: "Use the first shipping option"
    assert:
      tools:
        some:
          having:
            name: { equals: "calculate_total" }

  - user: "Confirm and pay"
    assert:
      tools:
        filter:
          having:
            name: { equals: "charge_card" }
        count: { equals: 1 }

assert:
  tool_names:
    none: { equals: "delete_order" }
  response:
    having:
      durationMs: { max: 120000 }
      idleMs: { max: 60000 }
